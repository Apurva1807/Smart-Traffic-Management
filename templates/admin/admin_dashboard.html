<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | Smart Traffic</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial, sans-serif; background:#f4f6f9; }
.container { padding:25px; }

.cards {
    display:flex;
    gap:20px;
    margin-bottom:30px;
}
.card {
    background:white;
    padding:20px;
    border-radius:10px;
    width:220px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.charts {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    margin-top:20px;
}

.chart-box {
    background:white;
    padding:20px;
    border-radius:10px;
    height:350px;
}

canvas {
    width:100% !important;
    height:260px !important;
}

table {
    width:100%;
    margin-top:30px;
    border-collapse:collapse;
    background:white;
}
th,td {
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}
th {
    background:#2563eb;
    color:white;
}
</style>
</head>

<body>
<div class="container">

<h1>🚦 Traffic Control Center (Admin)</h1>

<!-- SUMMARY -->
<div class="cards">
    <div class="card">
        <h3>Total Junctions</h3>
        <p id="totalJunctions">{{ total_junctions }}</p>
    </div>
    <div class="card">
        <h3>Avg Wait Time</h3>
        <p id="avgWait">{{ avg_wait_time }} sec</p>
    </div>
    <div class="card">
        <h3>System Efficiency</h3>
        <p id="efficiency">{{ system_efficiency }}%</p>
    </div>
</div>

<!-- CHARTS -->
<div class="charts">
    <div class="chart-box">
        <h3>Traffic Volume</h3>
        <canvas id="trafficChart"></canvas>
    </div>
    <div class="chart-box">
        <h3>Wait Time</h3>
        <canvas id="waitChart"></canvas>
    </div>
</div>

<!-- ALERTS -->
<h2 style="margin-top:30px;">🚨 Live Alerts</h2>
<table>
<tr>
    <th>Type</th>
    <th>Message</th>
    <th>Time</th>
</tr>
{% for a in alerts %}
<tr>
    <td>{{ a.type }}</td>
    <td>{{ a.message }}</td>
    <td>{{ a.time }}</td>
</tr>
{% endfor %}
</table>

</div>

<script>
const junctionNames = {{ junction_names | tojson | safe }};
const trafficValues = {{ traffic_values | tojson | safe }};
const waitTimes = {{ wait_times | tojson | safe }};
const alertsData = {{ alerts | tojson | safe }};
</script>

<!-- 🔥 CHARTS -->
<script>
const trafficChart = new Chart(document.getElementById("trafficChart"), {
    type: "bar",
    data: {
        labels: junctionNames,
        datasets: [{
            label: "Vehicles",
            data: trafficValues,
            backgroundColor: "#4CAF50"
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false
    }
});

const waitChart = new Chart(document.getElementById("waitChart"), {
    type: "line",
    data: {
        labels: junctionNames,
        datasets: [{
            label: "Wait Time (sec)",
            data: waitTimes,
            borderColor: "#ff5722",
            backgroundColor: "rgba(255,87,34,0.2)",
            fill: true,
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false
    }
});
</script>
<script>
function trafficFactor() {
    const h = new Date().getHours();
    if (h >= 8 && h <= 11) return 1.5;   // morning rush
    if (h >= 17 && h <= 20) return 1.7;  // evening peak
    if (h >= 12 && h <= 16) return 1.2;  // normal
    return 0.7;                          // night
}

function updateAdminDashboard() {
    const factor = trafficFactor();

    // 🔄 Update Traffic Volume
    trafficChart.data.datasets[0].data =
        trafficChart.data.datasets[0].data.map(
            () => Math.floor((80 + Math.random()*120) * factor)
        );
    trafficChart.update();

    // 🔄 Update Wait Time
    waitChart.data.datasets[0].data =
        waitChart.data.datasets[0].data.map(
            v => Math.max(20, Math.floor(v + (Math.random()*10 - 5)))
        );
    waitChart.update();

    // 🔢 Avg wait calculation
    const avg =
        Math.floor(
            waitChart.data.datasets[0].data.reduce((a,b)=>a+b,0) /
            waitChart.data.datasets[0].data.length
        );

    document.getElementById("avgWait").innerText = avg + " sec";

    // ⚙ Efficiency calculation
    document.getElementById("efficiency").innerText =
        Math.max(60, 100 - avg) + "%";
}

// ⏱ Update every 5 seconds
setInterval(updateAdminDashboard, 5000);
</script>


</body>
</html>
