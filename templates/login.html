<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Smart Traffic</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-box {
            width: 360px;
            margin: 120px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 5px;
        }

        .login-box p {
            margin-bottom: 20px;
            color: #666;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #084298;
        }

        .back-link {
            margin-top: 15px;
            display: block;
            text-decoration: none;
            color: #0d6efd;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Sign In</h2>
    <p>Access traffic management dashboard</p>

    <form method="post">
        <!-- Email -->
        <input type="email" name="email" placeholder="Enter email" required>

        <!-- Role -->
        <select name="role" required>
            <option value="">Select Role</option>
            <option value="admin">Police Authority</option>
            <option value="user">User</option>
        </select>

        <!-- Password -->
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit">Sign In</button>
    </form>

    <a href="/" class="back-link">← Back to Home</a>
</div>

</body>
</html>
